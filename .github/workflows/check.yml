# Runs `npm run check` (wiki, licences, build, all tests) on GitHub's computers for every push to
# main and every pull request, and keeps the phone and tablet screenshots for two weeks. A red ✗
# on GitHub means something is broken. See docs/VERSION_CONTROL.md.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the wiki check's "page older than its code" rule
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
