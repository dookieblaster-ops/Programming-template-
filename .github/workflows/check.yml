# Runs `npm run check` (wiki, licences, build, all tests) on every push and pull request, on
# GitHub's computers, and keeps the phone and tablet screenshots for two weeks. A red ✗ on GitHub
# means something is broken. See docs/VERSION_CONTROL.md.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the wiki check's "page older than its code" rule
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
